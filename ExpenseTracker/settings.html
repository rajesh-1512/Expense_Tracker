<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPocket - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm glass-header sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-wallet me-2"></i>SmartPocket
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="mentor.html">AI Mentor</a></li>
                    <li class="nav-item"><a class="nav-link" href="budget.html">Budgets</a></li>
                    <li class="nav-item"><a class="nav-link" href="myexpense.html">MyExpense</a></li>
                    <li class="nav-item"><a class="nav-link" href="analysis.html">Analysis</a></li>
                    <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="user-display-name" class="text-white me-3 fw-medium">User</span>
                    <button id="logout-btn" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-sign-out-alt me-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center page-header">
                    <h2 class="page-title mb-0">Settings</h2>
                </div>

                <div class="card settings-card shadow-sm border-0">
                    <div class="card-body p-0">

                        <!-- Profile Section -->
                        <div class="settings-section">
                            <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-circle me-2 text-primary"></i>Profile
                                Settings</h5>
                            <form id="profile-form">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="settings-name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="settings-email" disabled>
                                        <div class="form-text">Email cannot be changed.</div>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <button type="submit" class="btn btn-primary">Update Profile</button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Preferences Section -->
                        <div class="settings-section bg-light">
                            <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders me-2 text-primary"></i>App
                                Preferences</h5>
                            <form id="preferences-form">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Currency</label>
                                        <select class="form-select" id="settings-currency">
                                            <option value="INR">Rupee (₹)</option>
                                            <option value="USD">Dollar ($)</option>
                                            <option value="EUR">Euro (€)</option>
                                            <option value="GBP">Pound (£)</option>
                                            <option value="JPY">Yen (¥)</option>
                                        </select>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <button type="submit" class="btn btn-primary">Save Preferences</button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Data Management -->
                        <div class="settings-section">
                            <h5 class="fw-bold mb-3 text-danger"><i
                                    class="fa-solid fa-triangle-exclamation me-2"></i>Danger Zone</h5>
                            <p class="text-muted">Once you delete your data, there is no going back. Please be certain.
                            </p>
                            <button class="btn btn-outline-danger" id="delete-data-btn">
                                <i class="fa-solid fa-trash me-2"></i>Delete All Transaction Data
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
