<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPocket - Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm glass-header sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-wallet me-2"></i>SmartPocket
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="mentor.html">AI Mentor</a></li>
                    <li class="nav-item"><a class="nav-link" href="budget.html">Budgets</a></li>
                    <li class="nav-item"><a class="nav-link" href="myexpense.html">MyExpense</a></li>
                    <li class="nav-item"><a class="nav-link active" href="analysis.html">Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="user-display-name" class="text-white me-3 fw-medium">User</span>
                    <button id="logout-btn" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-sign-out-alt me-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center page-header">
            <div>
                <h2 class="page-title mb-0">Financial Analysis</h2>
                <p class="text-muted mb-0">Deep dive into your spending habits.</p>
            </div>
            <div>
                <!-- Could add date filters here later -->
            </div>
        </div>

        <div class="row">
            <!-- Pie Chart: Category Breakdown -->
            <div class="col-md-6">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">Expenses by Category</h5>
                    <div style="height: 300px; width: 100%;">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Bar Chart: Monthly Income vs Expense -->
            <div class="col-md-6">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">Income vs Expense (Last 6 Months)</h5>
                    <div style="height: 300px; width: 100%;">
                        <canvas id="trendsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="fw-bold mb-0">Top Spending Categories</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Category</th>
                                        <th>Total Spent</th>
                                        <th>% of Total</th>
                                        <th>Transaction Count</th>
                                    </tr>
                                </thead>
                                <tbody id="stats-table">
                                    <!-- Loaded via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/analysis.js"></script>
</body>

</html>
